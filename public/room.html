<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>游戏房间 - ArcadeOnline</title>
<link rel="stylesheet" href="/style.css">
<script>
(function () {
  var origSet = Element.prototype.setPointerCapture;
  var origRelease = Element.prototype.releasePointerCapture;
  var origHas = Element.prototype.hasPointerCapture;
  Element.prototype.setPointerCapture = function (id) {
    try {
      return origSet.call(this, id);
    } catch (e) {
      return undefined;
    }
  };
  Element.prototype.releasePointerCapture = function (id) {
    try {
      return origRelease.call(this, id);
    } catch (e) {
      return undefined;
    }
  };
  Element.prototype.hasPointerCapture = function (id) {
    try {
      return origHas.call(this, id);
    } catch (e) {
      return false;
    }
  };
})();
</script>
<script src="/libs/ruffle/ruffle.js"></script>
<script src="/arcade.js"></script>
</head>
<body>
<header class="topbar">
  <h1 id="game-title">加载中…</h1>
  <a class="crumb" href="/">← 大厅</a>
  <a href="#" id="leave-room" class="crumb">退出房间</a>
  <span class="crumb">房间 <b id="room-name"></b></span>
  <span class="crumb">昵称 <b id="my-name"></b></span>
  <span class="badge" id="conn-badge">连接中…</span>
</header>

<div id="layout">
  <div id="stage-wrap">
    <div id="stage"></div>
    <div id="stage-status">连接中…</div>
  </div>

  <aside>
    <section class="panel">
      <h4>座位（占座后才能操作）</h4>
      <div class="host-line" id="host-line">连接中…</div>
      <button class="btn ghost" id="become-host" style="display:none">成为房主（运行游戏并直播）</button>
      <div class="seat-row p1" id="seat-1">
        <div class="seat-name"></div>
        <div class="who">空闲</div>
        <button class="btn" data-seat="1">占座</button>
      </div>
      <div class="seat-row p2" id="seat-2">
        <div class="seat-name"></div>
        <div class="who">空闲</div>
        <button class="btn" data-seat="2">占座</button>
      </div>
      <div class="mouse-line">鼠标控制：<b id="mouse-owner">无人</b>（仅房主可操作鼠标）</div>
    </section>

    <section class="panel">
      <h4>游客 · 观战 <span id="spec-count"></span></h4>
      <div class="spec-notice" id="spec-notice">你当前是观战状态，点击上方座位占座后即可操作游戏。</div>
      <ul id="spec-list"></ul>
    </section>

    <section class="panel">
      <h4>房间动态</h4>
      <div id="log"></div>
    </section>
  </aside>
</div>

<script src="/room.js"></script>
</body>
</html>
