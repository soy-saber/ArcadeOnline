<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ArcadeOnline - 童年游戏联机平台</title>
<link rel="stylesheet" href="/style.css">
</head>
<body class="lobby-page">
<header class="topbar">
  <a class="brand" href="/" aria-label="ArcadeOnline 首页">
    <span class="brand-mark" aria-hidden="true"></span>
    <h1>ArcadeOnline</h1>
  </a>
  <span class="topbar-tagline">旧梦重启 · 远方同席</span>
</header>

<main class="lobby-shell">
  <div class="login-card" id="login-card">
    <span class="login-kicker">漫游者名册</span>
    <h2>留下你的名字</h2>
    <label class="field-label" for="name-input">昵称</label>
    <input id="name-input" maxlength="12" placeholder="输入昵称" autocomplete="nickname">
    <button class="btn" id="name-btn">进入大厅 <span aria-hidden="true">→</span></button>
  </div>

  <div class="container" id="lobby" style="display:none">
    <div class="lobby-heading">
      <div>
        <span class="section-kicker">游戏藏馆</span>
        <h2>选择游戏</h2>
      </div>
      <p>欢迎回来，<b id="hello-name"></b><a href="#" id="rename">更换昵称</a></p>
    </div>
    <div class="game-grid" id="game-grid"></div>
  </div>
</main>

<script src="/arcade.js"></script>
<script>
(function () {
  const params = new URLSearchParams(location.search);
  const next = params.get("next");

  const card = document.getElementById("login-card");
  const lobby = document.getElementById("lobby");
  const input = document.getElementById("name-input");
  const btn = document.getElementById("name-btn");

  if (arcadeName()) {
    showLobby();
  } else {
    input.value = "";
    input.focus();
  }

  function showLobby() {
    card.style.display = "none";
    lobby.style.display = "block";
    document.getElementById("hello-name").textContent = arcadeName();
    fetch("/games.json")
      .then((r) => r.json())
      .then(renderGames)
      .catch((e) => console.error(e));
  }

  function renderGames(games) {
    const grid = document.getElementById("game-grid");
    grid.innerHTML = "";
    for (const g of games) {
      const d = document.createElement("div");
      d.className = "game-card";
      const seatText = g.seats
        .map((s) => "<div><b>" + s.label + "</b><span>" + s.hint + "</span></div>")
        .join("");
      const href = "/room.html?game=" + encodeURIComponent(g.id) + "&room=" + encodeURIComponent(g.room);
      d.innerHTML =
        "<div class='game-cover'><img src='/assets/game-" + encodeURIComponent(g.id) + ".png' alt='' loading='lazy'><span>典藏自 " + g.source + "</span></div>" +
        "<div class='game-card-body'>" +
          "<div class='game-title-row'><h3>" + g.title + "</h3><span class='room-state'><i></i>常驻</span></div>" +
          "<div class='seat-hints'>" + seatText + "</div>" +
          "<a class='btn game-enter' href='" + href + "'>进入房间 <span aria-hidden='true'>→</span></a>" +
        "</div>";
      grid.appendChild(d);
    }
  }

  btn.addEventListener("click", () => {
    const n = input.value.trim().slice(0, 12);
    if (!n) {
      input.focus();
      return;
    }
    localStorage.setItem("arcade_name", n);
    showLobby();
    if (next) location.href = next;
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") btn.click();
  });

  document.getElementById("rename").addEventListener("click", (e) => {
    e.preventDefault();
    localStorage.removeItem("arcade_name");
    location.href = "/";
  });
})();
</script>
</body>
</html>
